name: CI (Xcode Beta)

on:
  workflow_dispatch:
    inputs:
      xcode_version:
        description: 'Xcode version to test — use the app suffix (e.g., "16.3", "16.4_beta"). Run `ls /Applications/Xcode*.app` on a macos-15 runner to see available versions.'
        required: true
        type: string

jobs:
  beta-tests:
    name: Beta Tests (Xcode ${{ inputs.xcode_version }})
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode ${{ inputs.xcode_version }}
        run: |
          XCODE_PATH="/Applications/Xcode_${{ inputs.xcode_version }}.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "::error::Xcode ${{ inputs.xcode_version }} not found at $XCODE_PATH"
            echo "Available Xcode versions:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Restore SPM cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-beta-${{ runner.os }}-${{ inputs.xcode_version }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            spm-beta-${{ runner.os }}-${{ inputs.xcode_version }}-
            spm-${{ runner.os }}-

      - name: Resolve simulator destination
        id: simulator
        run: |
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name']:
                          print(f\"platform=iOS Simulator,id={d['udid']}\")
                          sys.exit(0)
          sys.exit(1)
          ")
          echo "destination=$SIMULATOR" >> "$GITHUB_OUTPUT"

      - name: Inject credentials
        env:
          BS_API_USER: ${{ secrets.BS_API_USER }}
          BS_API_PASSWORD: ${{ secrets.BS_API_PASSWORD }}
        run: |
          mkdir -p Sources/BluesnapSDK/Resources
          /usr/libexec/PlistBuddy \
            -c "Add :BsAPIUser string $BS_API_USER" \
            -c "Add :BsAPIPassword string $BS_API_PASSWORD" \
            -x Sources/BluesnapSDK/Resources/credentials.plist

          /usr/libexec/PlistBuddy \
            -c "Set :BsAPIUser $BS_API_USER" \
            -c "Set :BsAPIPassword $BS_API_PASSWORD" \
            Tests/BluesnapSDKIntegrationTests/Resources/credentials.plist

      - name: Run unit tests
        run: |
          xcodebuild test \
            -workspace BluesnapIOS.xcworkspace \
            -scheme BluesnapSDK \
            -testPlan BluesnapSDK \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -resultBundlePath TestResults/BetaUnitTests.xcresult

      - name: Run integration tests
        run: |
          xcodebuild test \
            -workspace BluesnapIOS.xcworkspace \
            -scheme BluesnapSDK \
            -testPlan BluesnapSDKIntegration \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -resultBundlePath TestResults/BetaIntegrationTests.xcresult

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-test-results
          path: TestResults/*.xcresult
