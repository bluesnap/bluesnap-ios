name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and test using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default="BluesnapSDKExample"
          echo $default | cat >default
          echo Using default scheme: $default
      - name: Build
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
          BS_API_USER: ${{ secrets.BS_API_USER }}
          BS_API_PASSWORD: ${{ secrets.BS_API_PASSWORD }}
        run: |
          /usr/libexec/PlistBuddy -c "add :BsAPIUser string $BS_API_USER" -c "add :BsAPIPassword string $BS_API_PASSWORD" -x Sources/BluesnapSDK/Resources/credentials.plist
          /usr/libexec/PlistBuddy -c "add :BsAPIUser string $BS_API_USER" -c "add :BsAPIPassword string $BS_API_PASSWORD" -x Tests/BluesnapSDKIntegrationTests/Resources/credentials.plist
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild build-for-testing -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,name=$device"
      - name: Unit Test
        env:
          scheme: ${{ 'BluesnapSDK' }}
          platform: ${{ 'iOS Simulator' }}
          #BS_API_USER: ${{ secrets.BS_API_USER }}
          #BS_API_PASSWORD: ${{ secrets.BS_API_PASSWORD }}
        run: |
          device=`xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//"`
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild test -scheme "$scheme" -testPlan BluesnapSDK -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,name=$device"
      - name: Integration Test
        env:
          scheme: ${{ 'BluesnapSDK' }}
          platform: ${{ 'iOS Simulator' }}
          #BS_API_USER: ${{ secrets.BS_API_USER }}
          #BS_API_PASSWORD: ${{ secrets.BS_API_PASSWORD }}
        run: |
          device=`xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//"`
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild test -scheme "$scheme" -testPlan BluesnapSDKIntegration -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,name=$device"
      - name: Sanity UI Test
        env:
          scheme: ${{ 'BluesnapSDKExample' }}
          platform: ${{ 'iOS Simulator' }}
          #BS_API_USER: ${{ secrets.BS_API_USER }}
          #BS_API_PASSWORD: ${{ secrets.BS_API_PASSWORD }}
        run: |
          device=`xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//"`
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild test -scheme "$scheme" -testPlan SanityUITests -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,name=$device"
